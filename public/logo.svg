<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="logo-arch-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#00C8D4" />
    </linearGradient>

    <linearGradient id="logo-arch-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B82FF" />
      <stop offset="100%" stop-color="#6457F9" />
    </linearGradient>

    <linearGradient id="logo-arch-top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#6457F9" />
      <stop offset="100%" stop-color="#8B82FF" />
    </linearGradient>

    <linearGradient id="logo-text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F0F0F4" />
      <stop offset="100%" stop-color="#00C8D4" />
    </linearGradient>

    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- === LOGOMARK ICON (Left) === -->
  <g transform="translate(10, 10)">
    <!-- Icon Container Box -->
    <rect width="60" height="60" rx="14" fill="#111114" />
    <rect width="58" height="58" x="1" y="1" rx="13" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2" />

    <!-- Isometric Hex Arch -->
    <g filter="url(#logo-glow)">
      <!-- Top Keystone -->
      <path d="M20 16 L30 10 L40 16 L35 20 L30 17 L25 20 Z" fill="url(#logo-arch-top)" />

      <!-- Left Pillar -->
      <path d="M20 16 L25 20 L18 32 L12 30 Z" fill="url(#logo-arch-left)" />
      <path d="M12 30 L18 32 L18 43 L12 40 Z" fill="#00A2AC" opacity="0.85" />
      <path d="M18 32 L24 35 L24 46 L18 43 Z" fill="url(#logo-arch-left)" />

      <!-- Right Pillar -->
      <path d="M40 16 L35 20 L42 32 L48 30 Z" fill="url(#logo-arch-right)" />
      <path d="M48 30 L42 32 L42 43 L48 40 Z" fill="#4B3DB8" opacity="0.85" />
      <path d="M42 32 L36 35 L36 46 L42 43 Z" fill="url(#logo-arch-right)" />

      <!-- Nexus Diamond Center -->
      <polygon points="30,23 37,28 30,32 23,28" fill="#18181C" stroke="url(#logo-arch-top)" stroke-width="1.5" />
      
      <!-- Connectors -->
      <line x1="30" y1="17" x2="30" y2="23" stroke="#00F2FE" stroke-width="1.5" stroke-linecap="round" />
      <line x1="23" y1="28" x2="18" y2="32" stroke="#00C8D4" stroke-width="1.2" stroke-linecap="round" />
      <line x1="37" y1="28" x2="42" y2="32" stroke="#8B82FF" stroke-width="1.2" stroke-linecap="round" />
      
      <!-- Nodes -->
      <circle cx="30" cy="10" r="2" fill="#FFFFFF" />
      <circle cx="12" cy="30" r="2" fill="#00F2FE" />
      <circle cx="48" cy="30" r="2" fill="#8B82FF" />
      <circle cx="30" cy="27.5" r="2.2" fill="#FFFFFF" stroke="#6457F9" stroke-width="1" />
      <circle cx="24" cy="46" r="1.5" fill="#00C8D4" />
      <circle cx="36" cy="46" r="1.5" fill="#6457F9" />
    </g>
  </g>

  <!-- === TYPOGRAPHY (Right) === -->
  <g transform="translate(86, 48)">
    <!-- Wordmark "Omni" -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Geist Sans', 'Inter', 'Segoe UI', sans-serif" font-size="29" font-weight="700" letter-spacing="-0.03em" fill="#F0F0F4">
      Omni<tspan fill="url(#logo-arch-left)">Arch</tspan>
    </text>

    <!-- Subtitle / Tagline Badge -->
    <text x="1" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Geist Mono', 'Fira Code', monospace" font-size="9" font-weight="500" letter-spacing="0.18em" fill="#808090" text-transform="uppercase">
      AI SYSTEM DESIGN CANVAS
    </text>
  </g>
</svg>
