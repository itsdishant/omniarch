<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background glow & ambient lighting -->
    <radialGradient id="omni-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00C8D4" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#6457F9" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#080809" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Gradients for Isometric Facets -->
    <linearGradient id="omni-arch-left" x1="20%" y1="10%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#00C8D4" />
      <stop offset="100%" stop-color="#1A3B5C" />
    </linearGradient>

    <linearGradient id="omni-arch-right" x1="20%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#8B82FF" />
      <stop offset="50%" stop-color="#6457F9" />
      <stop offset="100%" stop-color="#2D1A4E" />
    </linearGradient>

    <linearGradient id="omni-arch-top" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#7B61FF" />
      <stop offset="100%" stop-color="#9E8CFC" />
    </linearGradient>

    <linearGradient id="omni-core-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C8D4" />
      <stop offset="50%" stop-color="#6457F9" />
      <stop offset="100%" stop-color="#FF3B81" />
    </linearGradient>

    <linearGradient id="omni-beam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00C8D4" stop-opacity="0.2" />
    </linearGradient>

    <!-- Shadows & Filters -->
    <filter id="omni-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="omni-neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Container / Rounded Shield -->
  <rect width="128" height="128" rx="28" fill="#111114" />
  <rect width="128" height="128" rx="28" fill="url(#omni-glow)" />
  <rect width="126" height="126" x="1" y="1" rx="27" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Subtle Blueprint Coordinate Grid Pattern -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="0.75" stroke-dasharray="2 3">
    <line x1="24" y1="24" x2="104" y2="24" />
    <line x1="24" y1="64" x2="104" y2="64" />
    <line x1="24" y1="104" x2="104" y2="104" />
    <line x1="24" y1="24" x2="24" y2="104" />
    <line x1="64" y1="24" x2="64" y2="104" />
    <line x1="104" y1="24" x2="104" y2="104" />
  </g>

  <!-- Architectural Structure: Outer Isometric Hex-Arch ("A" + "O" Monogram) -->
  <g filter="url(#omni-drop-shadow)">
    <!-- Top Keystone / Cap (Apex of Arch) -->
    <path d="M42 34 L64 22 L86 34 L76 42 L64 35 L52 42 Z" fill="url(#omni-arch-top)" />

    <!-- Left Structural Pillar / Node Spine -->
    <path d="M42 34 L52 42 L38 68 L26 64 Z" fill="url(#omni-arch-left)" opacity="0.95" />
    <path d="M26 64 L38 68 L38 90 L26 84 Z" fill="#00A2AC" opacity="0.8" />
    <path d="M38 68 L50 74 L50 96 L38 90 Z" fill="url(#omni-arch-left)" />

    <!-- Right Structural Pillar / Node Spine -->
    <path d="M86 34 L76 42 L90 68 L102 64 Z" fill="url(#omni-arch-right)" opacity="0.95" />
    <path d="M102 64 L90 68 L90 90 L102 84 Z" fill="#4B3DB8" opacity="0.8" />
    <path d="M90 68 L78 74 L78 96 L90 90 Z" fill="url(#omni-arch-right)" />

    <!-- Center Interlocking Nexus Core (System Graph Gateway) -->
    <g filter="url(#omni-neon-glow)">
      <!-- Isometric Graph Diamond Core -->
      <polygon points="64,48 78,57 64,66 50,57" fill="#18181C" stroke="url(#omni-core-ring)" stroke-width="2.5" />
      
      <!-- Inner Connecting Beams -->
      <line x1="64" y1="35" x2="64" y2="48" stroke="#00F2FE" stroke-width="2.5" stroke-linecap="round" />
      <line x1="50" y1="57" x2="38" y2="68" stroke="#00C8D4" stroke-width="2" stroke-linecap="round" />
      <line x1="78" y1="57" x2="90" y2="68" stroke="#8B82FF" stroke-width="2" stroke-linecap="round" />
      <line x1="64" y1="66" x2="64" y2="85" stroke="#6457F9" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3" />
      
      <!-- Cross Architectural Tier -->
      <path d="M50 74 L64 66 L78 74" fill="none" stroke="url(#omni-arch-top)" stroke-width="2.5" stroke-linejoin="round" />

      <!-- High-Intensity Vertex Nodes (Collaborative Vertices) -->
      <circle cx="64" cy="22" r="3.5" fill="#FFFFFF" filter="drop-shadow(0 0 4px #00F2FE)" />
      <circle cx="26" cy="64" r="3.5" fill="#00F2FE" filter="drop-shadow(0 0 4px #00C8D4)" />
      <circle cx="102" cy="64" r="3.5" fill="#8B82FF" filter="drop-shadow(0 0 4px #6457F9)" />
      <circle cx="64" cy="57" r="4" fill="#FFFFFF" stroke="#6457F9" stroke-width="1.5" filter="drop-shadow(0 0 6px #00F2FE)" />
      <circle cx="50" cy="96" r="3" fill="#00C8D4" />
      <circle cx="78" cy="96" r="3" fill="#6457F9" />
    </g>
  </g>
</svg>
